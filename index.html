<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorting Visualizer - Nandini</title>

<style>
body {
    background: #0a0f1c;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

h1 {
    margin-top: 20px;
}

#array {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 350px;
    margin: 20px;
}

/* BARS */
.bar {
    width: 20px;
    margin: 2px;
    background: linear-gradient(180deg, #00d4ff, #0077ff);
    border-radius: 5px;
    transition: height 0.3s ease, background 0.3s;
}

.bar.compare {
    background: red;
}

.bar.swap {
    background: orange;
}

.bar.sorted {
    background: #00ff88;
}

.bar:hover {
    box-shadow: 0 0 10px #00d4ff;
}

/* CONTROLS */
.controls {
    margin: 20px;
}

button {
    padding: 10px;
    margin: 5px;
    border: none;
    background: #00d4ff;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: white;
}

input {
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Sorting Visualizer</h1>
<p>By Nandini • Interactive Algorithm Learning Tool</p>

<div class="controls">
    <button onclick="generateArray()">New Array</button>
    <button onclick="bubbleSort()">Start Sorting</button>
    <br>
    <label>Speed</label>
    <input type="range" id="speed" min="1" max="100" value="50">
</div>

<div id="array"></div>

<script>
let speed = 100;

/* SPEED CONTROL */
document.getElementById("speed").addEventListener("input", function() {
    speed = 200 - this.value;
});

/* DELAY */
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* GENERATE ARRAY */
function generateArray() {
    const container = document.getElementById("array");
    container.innerHTML = "";

    for (let i = 0; i < 30; i++) {
        let value = Math.floor(Math.random() * 300) + 20;

        let bar = document.createElement("div");
        bar.classList.add("bar");
        bar.style.height = value + "px";

        container.appendChild(bar);
    }
}

/* BUBBLE SORT */
async function bubbleSort() {
    let bars = document.querySelectorAll(".bar");

    for (let i = 0; i < bars.length; i++) {
        for (let j = 0; j < bars.length - i - 1; j++) {

            bars[j].classList.add("compare");
            bars[j+1].classList.add("compare");

            await sleep(speed);

            let val1 = parseInt(bars[j].style.height);
            let val2 = parseInt(bars[j+1].style.height);

            if (val1 > val2) {
                bars[j].classList.add("swap");
                bars[j+1].classList.add("swap");

                await sleep(speed);

                bars[j].style.height = val2 + "px";
                bars[j+1].style.height = val1 + "px";
            }

            bars[j].classList.remove("compare", "swap");
            bars[j+1].classList.remove("compare", "swap");
        }

        bars[bars.length - i - 1].classList.add("sorted");
    }
}

/* LOAD INITIAL ARRAY */
generateArray();
</script>

</body>
</html>
